[workspace]
resolver = "2"
members = [
    "crates/sankode-core",
    "crates/sankode-lexer",
    "crates/sankode-parser",
    "crates/sankode-semantics",
    "crates/sankode-borrowck",
    "crates/sankode-eval",
    "crates/sankode-cli",
    "crates/sankode-ime",
    "crates/sanskript",
    "crates/sankode-studio",
    "crates/sankode-codegen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["tovganesh"]
license = "MIT"
repository = "https://github.com/tovganesh/sankode"
description = "Pure Devanagari-Native Systems Programming Language"

[workspace.dependencies]
unicode-normalization = "0.1"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
rustyline = "15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
